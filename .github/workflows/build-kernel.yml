name: build-venus-kernel

# 小米 11（venus）LineageOS 23.2 / 5.4.302 内核构建
#
# v7 的核心结论（来自对官方 vendor_boot 里厂商模块的静态分析）：
#   厂商模块是用 CFI 编译的，未定义符号里带 `__cfi_slowpath`
#   （msm_drm.ko / fts_touch_spi.ko / xiaomi_touch.ko 等都依赖它）。
#   内核一旦不带 CONFIG_CFI_CLANG 就不导出该符号 → 模块全部加载失败 → 卡在开机 logo。
#   用非 AOSP clang 开 LTO+CFI 又容易产出起不来的内核，因此这里：
#     * 关掉 CFI/LTO（保证能编译、能启动）
#     * 补一个 `__cfi_slowpath` / `__cfi_slowpath_diag` 的 stub 并 EXPORT_SYMBOL
#   这样厂商模块就能正常加载。
#
#   line —— 原厂配置（仅上述 CFI 处理），工具链基线
#   dsp  —— 再加 droidspaces 选项 + venus 专用 kABI padding 补丁

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/**'
      - 'config/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [line, dsp]

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl \
            clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu

      - name: Fetch LineageOS kernel @ 7ede20c8
        run: |
          set -e
          git init -q k
          cd k
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git
          if git fetch -q --depth=1 origin 7ede20c8692e0e0fc044754429e33cfd1d75c40d; then
            echo "fetched exact commit"
          else
            echo "::warning::exact sha fetch failed, falling back to lineage-23.2 tip"
            git fetch -q --depth=1 origin lineage-23.2
          fi
          git checkout -q FETCH_HEAD
          git log --oneline -1
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion
          python3 - <<'PYEOF'
          import os, re
          count = 0
          for root, dirs, files in os.walk('.'):
              if '/.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.c'):
                      continue
                  src = os.path.join(root, f)
                  try:
                      text = open(src, errors='ignore').read()
                  except OSError:
                      continue
                  if 'CREATE_TRACE_POINTS' not in text:
                      continue
                  obj = f[:-2] + '.o'
                  mk = os.path.join(root, 'Makefile')
                  if not os.path.exists(mk):
                      continue
                  mtext = open(mk, errors='ignore').read()
                  if 'CFLAGS_' + obj in mtext:
                      continue
                  if not re.search(r'\b' + re.escape(obj) + r'\b', mtext):
                      continue
                  with open(mk, 'a') as fh:
                      fh.write('\nCFLAGS_%s := -I$(src)\n' % obj)
                  count += 1
          print('trace CFLAGS patched:', count)
          PYEOF
          # 厂商模块需要 __cfi_slowpath，CFI 关掉时补一个 stub
          cat > kernel/cfi_stub.c <<'CEOF'
          #include <linux/types.h>
          #include <linux/export.h>

          void __cfi_slowpath(u64 typeid, const void *ptr) { }
          EXPORT_SYMBOL(__cfi_slowpath);

          void __cfi_slowpath_diag(u64 typeid, const void *ptr, void *diag) { }
          EXPORT_SYMBOL(__cfi_slowpath_diag);
          CEOF
          grep -q 'cfi_stub.o' kernel/Makefile || echo 'obj-y += cfi_stub.o' >> kernel/Makefile

      - name: Apply droidspaces kABI patches
        if: matrix.variant == 'dsp'
        run: |
          set -e
          cd k
          patch -p1 --verbose < ../patches/001_sysvipc_venus.patch
          patch -p1 --verbose < ../patches/002_posix_mqueue_venus.patch

      - name: Configure
        run: |
          set -e
          cd k
          cp ../config/device-stock.config .config
          scripts/config --file .config -d LTO_CLANG -e LTO_NONE
          scripts/config --file .config -d CFI_CLANG
          scripts/config --file .config -d SHADOW_CALL_STACK
          scripts/config --file .config -d LOCALVERSION_AUTO
          scripts/config --file .config --set-str LOCALVERSION "-qgki-g7ede20c8692e"
          if [ "${{ matrix.variant }}" = "dsp" ]; then
            cat ../config/droidspaces-gki.config >> .config
          fi
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-18 LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTLD=ld.lld-18 HOSTAR=llvm-ar-18 \
            LLVM_IAS=1 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            olddefconfig
          if grep -q '^CONFIG_CFI_CLANG=y' .config; then
            echo "::error::CONFIG_CFI_CLANG unexpectedly enabled"
            exit 1
          fi
          echo "=== key config ==="
          grep -E '^CONFIG_(SYSVIPC|IPC_NS|PID_NS|POSIX_MQUEUE|USER_NS|DEVTMPFS|OVERLAY_FS|NET_NS|LTO|LTO_CLANG|CFI_CLANG|SHADOW_CALL_STACK|LOCALVERSION|LOCALVERSION_AUTO|MODVERSIONS)=' .config || true

      - name: Build Image
        run: |
          set -e
          cd k
          make -j"$(nproc)" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-18 LD=ld.lld-18 AR=llvm-ar-18 NM=llvm-nm-18 \
            OBJCOPY=llvm-objcopy-18 OBJDUMP=llvm-objdump-18 STRIP=llvm-strip-18 \
            HOSTCC=clang-18 HOSTLD=ld.lld-18 HOSTAR=llvm-ar-18 \
            LLVM_IAS=1 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" \
            Image 2>&1 | tee ../build.log
          ls -l arch/arm64/boot/Image
          echo "=== cfi stub export check ==="
          grep -E '__cfi_slowpath(__diag)?$' System.map || true
          if ! grep -q '__cfi_slowpath$' System.map; then
            echo "::error::__cfi_slowpath not exported"
            exit 1
          fi
          python3 - <<'PYEOF'
          p = 'arch/arm64/boot/Image'
          d = bytearray(open(p, 'rb').read())
          n = b'5.4.302-qgki-g7ede20c8692e+'
          c = d.count(n)
          i = 0
          while True:
              i = d.find(n, i)
              if i < 0:
                  break
              d[i + len(n) - 1] = 0
              i += 1
          open(p, 'wb').write(bytes(d))
          print('version "+" occurrences patched:', c)
          PYEOF
          strings arch/arm64/boot/Image | grep -m2 "Linux version 5.4" || true

      - name: Upload Image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-kernel-${{ matrix.variant }}
          path: |
            k/arch/arm64/boot/Image
            k/.config
            k/System.map
            build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
