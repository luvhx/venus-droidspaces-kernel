name: build-venus-kernel

# 小米 11（venus）LineageOS 23.2 / 5.4.302 内核构建
#
# 目标：尽量复刻 LineageOS 官方构建环境（AOSP clang + 原厂配置），先拿到“能开机”的基线，
# 再加 droidspaces 选项。
#
#   line   —— 纯原厂配置 + AOSP clang（不加任何 droidspaces 选项，验证工具链）
#   dsp    —— 原厂配置 + droidspaces 选项 + venus 专用 kABI padding 补丁
#
# 产出 arch/arm64/boot/Image，本地 tools/repack-boot.py 装回官方 boot.img 后 fastboot 刷入。

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/**'
      - 'config/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [line, dsp]

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl

      - name: Fetch LineageOS kernel @ 7ede20c8
        run: |
          set -e
          git init -q k
          cd k
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git
          if git fetch -q --depth=1 origin 7ede20c8692e0e0fc044754429e33cfd1d75c40d; then
            echo "fetched exact commit"
          else
            echo "::warning::exact sha fetch failed, falling back to lineage-23.2 tip"
            git fetch -q --depth=1 origin lineage-23.2
          fi
          git checkout -q FETCH_HEAD
          git log --oneline -1
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # 让 LOCALVERSION 不含 dirty 的 "+"（否则 vermagic 与 ROM 模块对不上）
          python3 - <<'PYEOF'
          import re
          p = 'scripts/setlocalversion'
          s = open(p).read()
          s2 = re.sub(r'\$\{scm_version:\+\+\}', '', s)
          if s2 != s:
              open(p, 'w').write(s2)
              print('setlocalversion patched')
          else:
              print('setlocalversion: pattern not found (check manually)')
          PYEOF
          # 这棵树里所有 CREATE_TRACE_POINTS 的 trace.c 都依赖 -I$(src)，Makefile 普遍没写
          python3 - <<'PYEOF'
          import os, re
          count = 0
          for root, dirs, files in os.walk('.'):
              if '/.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.c'):
                      continue
                  src = os.path.join(root, f)
                  try:
                      text = open(src, errors='ignore').read()
                  except OSError:
                      continue
                  if 'CREATE_TRACE_POINTS' not in text:
                      continue
                  obj = f[:-2] + '.o'
                  mk = os.path.join(root, 'Makefile')
                  if not os.path.exists(mk):
                      continue
                  mtext = open(mk, errors='ignore').read()
                  if 'CFLAGS_' + obj in mtext:
                      continue
                  if not re.search(r'\b' + re.escape(obj) + r'\b', mtext):
                      continue
                  with open(mk, 'a') as fh:
                      fh.write('\nCFLAGS_%s := -I$(src)\n' % obj)
                  count += 1
          print('trace CFLAGS patched:', count)
          PYEOF

      - name: Apply droidspaces kABI patches
        if: matrix.variant == 'dsp'
        run: |
          set -e
          cd k
          patch -p1 --verbose < ../patches/001_sysvipc_venus.patch
          patch -p1 --verbose < ../patches/002_posix_mqueue_venus.patch

      - name: Fetch AOSP clang (same family as LineageOS build)
        run: |
          set -e
          mkdir -p "$HOME/clang"
          for v in clang-r563880 clang-r547379 clang-r536225 clang-r522817 clang-r487747c; do
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/$v.tar.gz"
            echo "trying $v"
            if curl -fsSL --max-time 600 -o /tmp/clang.tar.gz "$url"; then
              tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
              echo "CLANG_VERSION=$v" >> "$GITHUB_ENV"
              break
            fi
          done
          if [ -z "$CLANG_VERSION" ]; then
            echo "::error::could not download any AOSP clang prebuilt"
            exit 1
          fi
          "$HOME/clang/bin/clang" --version

      - name: Configure (stock config, unchanged)
        run: |
          set -e
          cd k
          cp ../config/device-stock.config .config
          if [ "${{ matrix.variant }}" = "dsp" ]; then
            cat ../config/droidspaces-gki.config >> .config
          fi
          make ARCH=arm64 olddefconfig
          echo "=== key config ==="
          grep -E '^CONFIG_(SYSVIPC|IPC_NS|PID_NS|POSIX_MQUEUE|USER_NS|DEVTMPFS|OVERLAY_FS|NET_NS|LTO|LTO_CLANG|CFI_CLANG|LOCALVERSION|LOCALVERSION_AUTO|CMDLINE|MODVERSIONS)=' .config || true

      - name: Build Image
        run: |
          set -e
          cd k
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee ../build.log
          ls -l arch/arm64/boot/Image
          strings arch/arm64/boot/Image | grep -m2 "Linux version 5.4" || true

      - name: Upload Image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-kernel-${{ matrix.variant }}
          path: |
            k/arch/arm64/boot/Image
            k/.config
            k/System.map
            build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
