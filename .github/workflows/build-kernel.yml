name: build-venus-kernel

# Xiaomi Mi 11 (venus) - LineageOS 23.2 / 5.4.302 kernel build
#
# What we learned:
#   v1-v3: Ubuntu clang with LTO/CFI disabled -> kernel never booted.
#   v5:    vendor modules (msm_drm.ko, fts_touch_spi.ko, ...) are CFI-instrumented and
#          reference __cfi_slowpath, which only exists with CONFIG_CFI_CLANG=y.
#   v7:    CFI off + __cfi_slowpath stub -> still did not boot.
#   v8:    replicate the official build:
#            * AOSP clang prebuilt (same family LineageOS uses)
#            * stock device config untouched (LTO/CFI/SCS stay on)
#            * -D__ANDROID_COMMON_KERNEL__ (as build.config.common does)
#            * LOCALVERSION pinned to the ROM vermagic, no dirty "+"
#
#   line -> stock config only (toolchain baseline)
#   dsp  -> + droidspaces options + venus kABI padding patches

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'patches/**'
      - 'config/**'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [line, dsp]

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            python3 zip unzip cpio kmod device-tree-compiler curl \
            gcc-aarch64-linux-gnu

      - name: Fetch LineageOS kernel @ 7ede20c8
        run: |
          set -e
          git init -q k
          cd k
          git remote add origin https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git
          if git fetch -q --depth=1 origin 7ede20c8692e0e0fc044754429e33cfd1d75c40d; then
            echo "fetched exact commit"
          else
            echo "::warning::exact sha fetch failed, falling back to lineage-23.2 tip"
            git fetch -q --depth=1 origin lineage-23.2
          fi
          git checkout -q FETCH_HEAD
          git log --oneline -1
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sed -i 's|res="$res${scm:++}"|res="$res"|' scripts/setlocalversion
          python3 - <<'PYEOF'
          import os, re
          count = 0
          for root, dirs, files in os.walk('.'):
              if '/.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.c'):
                      continue
                  src = os.path.join(root, f)
                  try:
                      text = open(src, errors='ignore').read()
                  except OSError:
                      continue
                  if 'CREATE_TRACE_POINTS' not in text:
                      continue
                  obj = f[:-2] + '.o'
                  mk = os.path.join(root, 'Makefile')
                  if not os.path.exists(mk):
                      continue
                  mtext = open(mk, errors='ignore').read()
                  if 'CFLAGS_' + obj in mtext:
                      continue
                  if not re.search(r'\b' + re.escape(obj) + r'\b', mtext):
                      continue
                  with open(mk, 'a') as fh:
                      fh.write('\nCFLAGS_%s := -I$(src)\n' % obj)
                  count += 1
          print('trace CFLAGS patched:', count)
          PYEOF

      - name: Fetch AOSP clang prebuilt
        run: |
          set -e
          mkdir -p "$HOME/clang"
          curl -fsSL --max-time 120 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+/refs/heads/main?format=JSON" \
            -o /tmp/clanglist.json || true
          tail -c +5 /tmp/clanglist.json > /tmp/clanglist2.json || true
          V=$(python3 - <<'PYEOF'
          import json, re
          try:
              d = json.load(open('/tmp/clanglist2.json'))
              names = [e['name'] for e in d.get('entries', []) if re.match(r'^clang-r\d+', e['name'])]
              names.sort(key=lambda s: int(re.match(r'clang-r(\d+)', s).group(1)))
              print(names[-1] if names else '')
          except Exception:
              print('')
          PYEOF
          )
          if [ -z "$V" ]; then V=clang-r563880; fi
          echo "candidate: $V"
          ok=0
          for v in "$V" clang-r563880 clang-r547379 clang-r536225 clang-r522817; do
            if curl -fsSL --max-time 900 -o /tmp/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/$v.tar.gz"; then
              tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
              echo "CLANG_VERSION=$v" >> "$GITHUB_ENV"
              ok=1
              break
            fi
          done
          if [ "$ok" = "0" ]; then
            echo "::error::could not download any AOSP clang prebuilt"
            exit 1
          fi
          "$HOME/clang/bin/clang" --version

      - name: Apply droidspaces kABI patches
        if: matrix.variant == 'dsp'
        run: |
          set -e
          cd k
          patch -p1 --verbose < ../patches/001_sysvipc_venus.patch
          patch -p1 --verbose < ../patches/002_posix_mqueue_venus.patch

      - name: Configure (stock config, CFI kept enabled)
        run: |
          set -e
          cd k
          export PATH="$HOME/clang/bin:$PATH"
          cp ../config/device-stock.config .config
          scripts/config --file .config -d LOCALVERSION_AUTO
          scripts/config --file .config --set-str LOCALVERSION "-qgki-g7ede20c8692e"
          if [ "${{ matrix.variant }}" = "dsp" ]; then
            cat ../config/droidspaces-gki.config >> .config
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" olddefconfig
          if ! grep -q '^CONFIG_CFI_CLANG=y' .config; then
            echo "::error::CONFIG_CFI_CLANG lost during olddefconfig"
            exit 1
          fi
          echo "=== key config ==="
          grep -E '^CONFIG_(SYSVIPC|IPC_NS|PID_NS|POSIX_MQUEUE|USER_NS|DEVTMPFS|OVERLAY_FS|NET_NS|LTO|LTO_CLANG|CFI_CLANG|SHADOW_CALL_STACK|LOCALVERSION|LOCALVERSION_AUTO|MODVERSIONS)=' .config || true

      - name: Build Image
        run: |
          set -e
          cd k
          export PATH="$HOME/clang/bin:$PATH"
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-D__ANDROID_COMMON_KERNEL__" Image 2>&1 | tee ../build.log
          ls -l arch/arm64/boot/Image
          grep -E '__cfi_slowpath(__diag)?$' System.map | head -3 || true
          if ! grep -q '__cfi_slowpath$' System.map; then
            echo "::error::__cfi_slowpath not exported"
            exit 1
          fi
          python3 - <<'PYEOF'
          p = 'arch/arm64/boot/Image'
          d = bytearray(open(p, 'rb').read())
          n = b'5.4.302-qgki-g7ede20c8692e+'
          c = d.count(n)
          i = 0
          while True:
              i = d.find(n, i)
              if i < 0:
                  break
              d[i + len(n) - 1] = 0
              i += 1
          open(p, 'wb').write(bytes(d))
          print('version "+" occurrences patched:', c)
          PYEOF
          strings arch/arm64/boot/Image | grep -m2 "Linux version 5.4" || true

      - name: Upload Image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-kernel-${{ matrix.variant }}
          path: |
            k/arch/arm64/boot/Image
            k/.config
            k/System.map
            build.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
